x-app-env: &app-env
  DATABASE_URL: postgresql://analyzer:analyzer@postgres:5432/instagram_analyzer
  REDIS_URL: redis://redis:6379/0
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  OPENROUTER_MODEL: ${OPENROUTER_MODEL:-qwen/qwen3.8-max}
  SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env (>= 16 chars)}
  ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
  LIARA_ENDPOINT: ${LIARA_ENDPOINT:-}
  LIARA_ACCESS_KEY: ${LIARA_ACCESS_KEY:-}
  LIARA_SECRET_KEY: ${LIARA_SECRET_KEY:-}
  LIARA_BUCKET_NAME: ${LIARA_BUCKET_NAME:-}
  MINIO_ENDPOINT: ${MINIO_ENDPOINT:-}
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-}
  MINIO_BUCKET: ${MINIO_BUCKET:-}
  MINIO_POLL_INTERVAL_SECONDS: ${MINIO_POLL_INTERVAL_SECONDS:-60}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: instagram_analyzer
      POSTGRES_USER: analyzer
      POSTGRES_PASSWORD: analyzer
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analyzer -d instagram_analyzer"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  migrate:
    build:
      context: ./instagram_analyzer_app
    image: influ-ocr:latest
    command: alembic upgrade head
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: ./instagram_analyzer_app
    image: influ-ocr:latest
    ports:
      - "127.0.0.1:8010:8000"
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - uploads:/tmp/uploads
      - processing:/tmp/processing
      - logs:/tmp/logs
    restart: unless-stopped

  worker:
    build:
      context: ./instagram_analyzer_app
    image: influ-ocr:latest
    command: celery -A celery_app.celery worker --loglevel=info --concurrency=2
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - uploads:/tmp/uploads
      - processing:/tmp/processing
      - logs:/tmp/logs
    restart: unless-stopped

  beat:
    build:
      context: ./instagram_analyzer_app
    image: influ-ocr:latest
    command: celery -A celery_app.celery beat --loglevel=info
    environment: *app-env
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  loki:
    image: grafana/loki:3
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki_data:/loki
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./observability/promtail.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.6.0
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - ./observability/grafana-datasources.yml:/etc/grafana/provisioning/datasources/loki.yml:ro
      - ./observability/grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/provider.yml:ro
      - ./observability/ai-costs-dashboard.json:/etc/grafana/provisioning/dashboards/ai-costs.json:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - loki
    restart: unless-stopped

volumes:
  postgres_data:
  uploads:
  processing:
  logs:
  loki_data:
  grafana_data:
