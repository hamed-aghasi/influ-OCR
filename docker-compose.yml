services:
  app:
    build:
      context: ./instagram_analyzer_app
    image: influ-ocr:latest
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://analyzer:analyzer@postgres:5432/instagram_analyzer
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      SECRET_KEY: ${SECRET_KEY:-change-this-secret-key-in-production}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      LIARA_ENDPOINT: ${LIARA_ENDPOINT:-}
      LIARA_ACCESS_KEY: ${LIARA_ACCESS_KEY:-}
      LIARA_SECRET_KEY: ${LIARA_SECRET_KEY:-}
      LIARA_BUCKET_NAME: ${LIARA_BUCKET_NAME:-}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads:/tmp/uploads
      - processing:/tmp/processing
      - logs:/tmp/logs
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: instagram_analyzer
      POSTGRES_USER: analyzer
      POSTGRES_PASSWORD: analyzer
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analyzer -d instagram_analyzer"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
  uploads:
  processing:
  logs:
