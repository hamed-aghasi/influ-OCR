x-app-env: &app-env
  DATABASE_URL: postgresql://analyzer:analyzer@postgres:5432/instagram_analyzer
  REDIS_URL: redis://redis:6379/0
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  OPENROUTER_MODEL: ${OPENROUTER_MODEL:-google/gemini-3.7-flash}
  SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env (>= 16 chars)}
  ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
  LIARA_ENDPOINT: ${LIARA_ENDPOINT:-}
  LIARA_ACCESS_KEY: ${LIARA_ACCESS_KEY:-}
  LIARA_SECRET_KEY: ${LIARA_SECRET_KEY:-}
  LIARA_BUCKET_NAME: ${LIARA_BUCKET_NAME:-}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: instagram_analyzer
      POSTGRES_USER: analyzer
      POSTGRES_PASSWORD: analyzer
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analyzer -d instagram_analyzer"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  migrate:
    build:
      context: ./instagram_analyzer_app
    image: influ-ocr:latest
    command: alembic upgrade head
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: ./instagram_analyzer_app
    image: influ-ocr:latest
    ports:
      - "8000:8000"
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - uploads:/tmp/uploads
      - processing:/tmp/processing
      - logs:/tmp/logs
    restart: unless-stopped

  worker:
    build:
      context: ./instagram_analyzer_app
    image: influ-ocr:latest
    command: celery -A celery_app.celery worker --loglevel=info --concurrency=2
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - uploads:/tmp/uploads
      - processing:/tmp/processing
      - logs:/tmp/logs
    restart: unless-stopped

  beat:
    build:
      context: ./instagram_analyzer_app
    image: influ-ocr:latest
    command: celery -A celery_app.celery beat --loglevel=info
    environment: *app-env
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data:
  uploads:
  processing:
  logs:
